name: ETL Semanal — Inthegra

on:
  # Corre todos los lunes a las 3:00 AM UTC (12 AM Argentina)
  schedule:
    - cron: '0 3 * * 1'

  # Permite correrlo manualmente desde GitHub Actions
  workflow_dispatch:
    inputs:
      modo:
        description: 'Modo de ejecucion'
        required: true
        default: 'incremental'
        type: choice
        options:
          - incremental
          - full
      sin_jsm:
        description: 'Omitir JSM (soporte)'
        required: false
        default: 'true'
        type: choice
        options:
          - 'true'
          - 'false'

jobs:
  etl:
    name: Extraccion de datos (Jira + AT → Turso)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout codigo
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Instalar dependencias
        run: pip install requests pandas python-dotenv httpx

      - name: Crear archivo .env desde secrets
        run: |
          cat > .env << EOF
          JIRA_BASE_URL=${{ secrets.JIRA_BASE_URL }}
          JIRA_EMAIL=${{ secrets.JIRA_EMAIL }}
          JIRA_API_TOKEN=${{ secrets.JIRA_API_TOKEN }}
          JIRA_PROJECTS=${{ secrets.JIRA_PROJECTS }}
          AT_BASE_URL=${{ secrets.AT_BASE_URL }}
          AT_TOKEN=${{ secrets.AT_TOKEN }}
          TURSO_URL=${{ secrets.TURSO_URL }}
          TURSO_TOKEN=${{ secrets.TURSO_TOKEN }}
          QMETRY_PROJECT_KEY=${{ secrets.QMETRY_PROJECT_KEY }}
          EOF

      - name: Job 1 — ETL incremental
        run: |
          MODO="${{ github.event.inputs.modo || 'incremental' }}"
          SIN_JSM="${{ github.event.inputs.sin_jsm || 'true' }}"

          ARGS=""
          if [ "$MODO" = "full" ]; then
            ARGS="$ARGS --full"
          fi
          if [ "$SIN_JSM" = "true" ]; then
            ARGS="$ARGS --sin-jsm"
          fi

          echo "Corriendo: python etl.py $ARGS"
          python etl.py $ARGS

      - name: Job 2 — Refresh modelo estrella (vistas)
        run: python refresh_vistas.py

      - name: Notificacion de resultado
        if: always()
        run: |
          if [ "${{ job.status }}" = "success" ]; then
            echo "✓ ETL completado exitosamente — $(date)"
          else
            echo "✗ ETL falló — revisar logs de GitHub Actions"
            exit 1
          fi
