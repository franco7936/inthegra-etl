name: ETL Semanal — Inthegra

on:
  schedule:
    - cron: '0 3 * * *'

  workflow_dispatch:
    inputs:
      modo:
        description: 'Modo de ejecucion'
        required: true
        default: 'incremental'
        type: choice
        options:
          - incremental
          - full
      recrear_modelo:
        description: 'Recrear modelo v2 desde cero (usar solo una vez)'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'
      sin_jsm:
        description: 'Omitir JSM (soporte)'
        required: false
        default: 'true'
        type: choice
        options:
          - 'true'
          - 'false'
      sin_at:
        description: 'Omitir ActivityTimeline'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'
      sin_worklogs:
        description: 'Omitir worklogs de Jira'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'

concurrency:
  group: etl-${{ github.ref }}
  cancel-in-progress: false

jobs:
  etl:
    name: ETL principal Jira + ActivityTimeline → Turso
    runs-on: ubuntu-24.04
    timeout-minutes: 120

    steps:
      - name: Checkout codigo
        uses: actions/checkout@v5

      - name: Setup Python 3.11
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Crear archivo .env desde secrets
        run: |
          cat > .env << EOF
          JIRA_BASE_URL=${{ secrets.JIRA_BASE_URL }}
          JIRA_EMAIL=${{ secrets.JIRA_EMAIL }}
          JIRA_API_TOKEN=${{ secrets.JIRA_API_TOKEN }}
          JIRA_PROJECTS=${{ secrets.JIRA_PROJECTS }}
          AT_BASE_URL=${{ secrets.AT_BASE_URL }}
          AT_TOKEN=${{ secrets.AT_TOKEN }}
          TURSO_URL=${{ secrets.TURSO_URL }}
          TURSO_TOKEN=${{ secrets.TURSO_TOKEN }}
          QMETRY_PROJECT_KEY=${{ secrets.QMETRY_PROJECT_KEY }}
          EOF

      - name: Ejecutar ETL principal
        timeout-minutes: 110
        env:
          JIRA_MAX_RETRIES: '5'
          JIRA_RETRY_BASE_SECONDS: '5'
          JIRA_PAGE_SIZE: '50'
          JIRA_PAGE_SLEEP_SECONDS: '0.25'
          AT_WORKLOG_MAX_PAGES_PER_TEAM: '25'
          AT_WORKLOG_MAX_ROWS_PER_TEAM: '10000'
        run: |
          MODO="${{ github.event.inputs.modo || 'incremental' }}"
          RECREAR_MODELO="${{ github.event.inputs.recrear_modelo || 'false' }}"
          SIN_JSM="${{ github.event.inputs.sin_jsm || 'true' }}"
          SIN_AT="${{ github.event.inputs.sin_at || 'false' }}"
          SIN_WORKLOGS="${{ github.event.inputs.sin_worklogs || 'false' }}"

          ARGS=""
          if [ "$MODO" = "full" ]; then
            ARGS="$ARGS --full"
          fi
          if [ "$RECREAR_MODELO" = "true" ]; then
            ARGS="$ARGS --recrear-modelo"
          fi
          if [ "$SIN_JSM" = "true" ]; then
            ARGS="$ARGS --sin-jsm"
          fi
          if [ "$SIN_AT" = "true" ]; then
            ARGS="$ARGS --sin-at"
          fi
          if [ "$SIN_WORKLOGS" = "true" ]; then
            ARGS="$ARGS --sin-worklogs"
          fi

          echo "Corriendo: python etl_runner.py $ARGS"
          python etl_runner.py $ARGS

      - name: Resultado correcto
        if: success()
        run: echo "✓ ETL completado exitosamente — $(date)"

      - name: Resultado con error
        if: failure()
        run: echo "✗ ETL falló — revisar el paso Ejecutar ETL principal"

      - name: Resultado cancelado
        if: cancelled()
        run: echo "ETL cancelado — revisar si fue por tiempo, por una nueva corrida o por cancelacion manual"
